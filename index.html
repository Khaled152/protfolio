
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Operator-OS // Portfolio</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=JetBrains+Mono:wght@300;500&display=swap" rel="stylesheet">
    <script>
        // Shim process.env for browser environments to prevent crashes
        window.process = window.process || { env: { API_KEY: '' } };
    </script>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #020617;
            color: #22d3ee;
            font-family: 'JetBrains Mono', monospace;
            overflow-x: hidden;
        }
        .font-hud { font-family: 'Orbitron', sans-serif; }
        
        /* Scanline effect */
        .scanlines {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(
                rgba(18, 16, 16, 0) 50%,
                rgba(0, 0, 0, 0.25) 50%
            ), linear-gradient(
                90deg,
                rgba(255, 0, 0, 0.06),
                rgba(0, 255, 0, 0.02),
                rgba(0, 0, 255, 0.06)
            );
            background-size: 100% 4px, 3px 100%;
            pointer-events: none;
            z-index: 50;
            opacity: 0.1;
        }

        /* Flicker animation */
        @keyframes flicker {
            0% { opacity: 0.97; }
            5% { opacity: 0.95; }
            10% { opacity: 0.9; }
            15% { opacity: 0.95; }
            20% { opacity: 0.8; }
            25% { opacity: 0.95; }
            80% { opacity: 0.95; }
            100% { opacity: 0.98; }
        }
        .flicker { animation: flicker 0.1s infinite; }

        /* Glitch effect */
        @keyframes glitch {
            0% { transform: translate(0); }
            20% { transform: translate(-2px, 2px); }
            40% { transform: translate(-2px, -2px); }
            60% { transform: translate(2px, 2px); }
            80% { transform: translate(2px, -2px); }
            100% { transform: translate(0); }
        }
        .glitch:hover { animation: glitch 0.3s cubic-bezier(.25, .46, .45, .94) both infinite; }

        /* HUD Borders */
        .hud-border {
            position: relative;
            border: 1px solid rgba(34, 211, 238, 0.3);
            background: rgba(15, 23, 42, 0.6);
            backdrop-filter: blur(8px);
        }
        .hud-border::before, .hud-border::after {
            content: '';
            position: absolute;
            width: 10px;
            height: 10px;
            border-color: #22d3ee;
            border-style: solid;
        }
        .hud-border-tl::before { top: -2px; left: -2px; border-width: 2px 0 0 2px; }
        .hud-border-tr::after { top: -2px; right: -2px; border-width: 2px 2px 0 0; }
        .hud-border-bl::before { bottom: -2px; left: -2px; border-width: 0 0 2px 2px; }
        .hud-border-br::after { bottom: -2px; right: -2px; border-width: 0 2px 2px 0; }

        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #22d3ee; }
    </style>
<script type="importmap">
